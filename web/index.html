<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIXELATE · web lab</title>
  <meta name="description" content="PIXELATE playground — local-image pixel art with retro palettes and dithering." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="playground.css" />
</head>
<body>
  <div class="scan-page" aria-hidden="true"></div>
  <div class="app">
    <header class="mast">
      <pre class="logo" aria-label="PIXELATE">PIXELATE</pre>
      <p class="tag">web lab · v2.2.0 · file stays in the browser · lab matching</p>
    </header>

    <section class="rack">
      <label class="btn">
        load image
        <input id="file" type="file" accept="image/*" hidden />
      </label>

      <label class="field">
        palette
        <select id="palette"></select>
      </label>

      <label class="field">
        dither
        <select id="dither">
          <option value="floyd">floyd</option>
          <option value="atkinson">atkinson</option>
          <option value="bayer">bayer</option>
          <option value="jjn">jjn</option>
          <option value="none">none</option>
        </select>
      </label>

      <label class="field slider">
        pixel size <span id="pixelSizeVal">96</span>
        <input id="pixelSize" type="range" min="16" max="256" step="4" value="96" />
      </label>

      <label class="field slider">
        upscale <span id="upscaleVal">4</span>
        <input id="upscale" type="range" min="1" max="8" step="1" value="4" />
      </label>

      <label class="tog">
        <input id="crt" type="checkbox" />
        CRT
      </label>
      <label class="tog">
        <input id="scanlines" type="checkbox" checked />
        scanlines
      </label>

      <button id="download" class="btn primary" type="button">download png</button>
    </section>

    <section class="stage">
      <figure class="bezel">
        <figcaption>source</figcaption>
        <canvas id="srcCanvas" width="320" height="200"></canvas>
      </figure>
      <figure class="bezel out-frame" id="outFrame">
        <figcaption>output</figcaption>
        <div class="crt-wrap" id="crtWrap">
          <canvas id="outCanvas" width="320" height="200"></canvas>
          <div class="vignette"></div>
          <div class="scan-crt"></div>
        </div>
      </figure>
    </section>

    <footer class="status">
      <span id="status">drop a file or use the demo signal</span>
      <span class="swatches" id="swatches"></span>
    </footer>
  </div>
  <script src="playground.js"></script>
</body>
</html>
