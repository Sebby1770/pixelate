[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelate"
version = "3.0.0"
description = "A retro pixel art converter CLI with classic gaming palettes, auto palette extraction, perceptual CIELAB matching, dithering, retro effects (CRT, outline, chromatic, NTSC bleed), animation, batch convert, compare grids, and spritesheets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Seb", email = "sebforbes03@gmail.com" }
]
keywords = ["pixel-art", "retro", "gameboy", "nes", "ascii-art", "cli", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

[project.scripts]
pixelate = "pixelate.cli:cli"

[project.urls]
Homepage = "https://github.com/Sebby1770/pixelate"
Issues = "https://github.com/Sebby1770/pixelate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixelate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
# Deliberately NOT pinning python_version: it sets the syntax level used to
# parse *every* file including third-party stubs, and modern numpy stubs use
# PEP 695 `type` statements that fail to parse below 3.12. Type-check on the
# running interpreter instead. Python 3.9 compatibility is enforced by ruff's
# target-version and by the 3.9 job in the CI test matrix.
ignore_missing_imports = true
# PIL's stubs are incomplete (Image.LANCZOS etc.); check our own code without
# drowning in third-party stub noise.
disable_error_code = ["attr-defined", "assignment", "arg-type"]
files = ["pixelate"]
