[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelate"
version = "3.0.0"
description = "Retro pixel art converter: ZX Spectrum / C64 / MSX / NES attribute-clash emulation, Knoll pattern and blue-noise dithering, a fast LUT error-diffusion engine, presets, SVG/JSON/C export, CRT effects, animation, and a browser Studio."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Seb", email = "sebforbes03@gmail.com" }
]
keywords = ["pixel-art", "retro", "dithering", "zx-spectrum", "c64", "nes", "gameboy", "ascii-art", "cli", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
pixelate = "pixelate.cli:cli"

[project.urls]
Homepage = "https://github.com/Sebby1770/pixelate"
Issues = "https://github.com/Sebby1770/pixelate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixelate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["web", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
# python_version is deliberately not pinned: modern numpy stubs use PEP 695
# syntax that fails to parse below 3.12. 3.9 compatibility is enforced by
# ruff's target-version and the 3.9 CI job.
ignore_missing_imports = true
warn_unused_ignores = false
files = ["pixelate"]
